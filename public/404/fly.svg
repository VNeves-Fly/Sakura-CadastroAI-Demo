<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para o avião para dar profundidade -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#cbd5e1"/>
    </filter>
  </defs>

  <!-- Nuvens Animadas ao Fundo -->
  <g fill="#f8fafc">
    <!-- Nuvem 1 (Vai da esquerda para a direita) -->
    <path d="M 120 160 a 20 20 0 0 1 15 -18 a 25 25 0 0 1 45 0 a 15 15 0 0 1 0 30 h -60 a 15 15 0 0 1 0 -12 z">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="900 0" dur="30s" repeatCount="indefinite" />
    </path>
    <!-- Nuvem 2 (Mais lenta) -->
    <path d="M 620 100 a 25 25 0 0 1 20 -22 a 35 35 0 0 1 60 0 a 20 20 0 0 1 0 40 h -80 a 20 20 0 0 1 0 -18 z">
      <animateTransform attributeName="transform" type="translate" from="-800 0" to="300 0" dur="45s" repeatCount="indefinite" />
    </path>
    <!-- Nuvem 3 (Pequena, na parte inferior) -->
    <path d="M 220 280 a 15 15 0 0 1 10 -14 a 20 20 0 0 1 35 0 a 10 10 0 0 1 0 20 h -45 a 10 10 0 0 1 0 -6 z" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="800 0" dur="35s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Rota do Avião (Trajeto Tracejado em formato de Infinito) -->
  <path id="flightPath" d="M 400 200 C 500 50, 720 50, 720 200 C 720 350, 500 350, 400 200 C 300 50, 80 50, 80 200 C 80 350, 300 350, 400 200 Z" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8, 12" stroke-linecap="round" />

  <!-- Área Central: Textos -->
  <g text-anchor="middle">
    <!-- Truque: Um texto 404 com borda grossa branca embaixo, para 'apagar' a linha tracejada quando ela passar por trás do texto -->
    <text x="400" y="210" font-size="140" font-weight="900" fill="#1e293b" stroke="#ffffff" stroke-width="16" stroke-linejoin="round">404</text>
    
    <!-- Texto 404 Principal -->
    <text x="400" y="210" font-size="140" font-weight="900" fill="#0f172a">404</text>
    
    <!-- Mensagens -->
    <text x="400" y="260" font-size="28" font-weight="bold" fill="#334155">Destino não encontrado</text>
    <text x="400" y="295" font-size="18" fill="#64748b">Ops! Parece que você se perdeu por aqui...</text>
  </g>

  <!-- Elemento Animado: Avião Comercial -->
  <g filter="url(#shadow)">
    <!-- O transform orienta o avião (que originalmente aponta pra cima) para apontar para a direita, alinhando com a rota -->
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#E91E63" transform="translate(-12, -12) rotate(90) scale(1.3)" />
    
    <!-- AnimateMotion faz o avião seguir o caminho com id="flightPath" -->
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flightPath"/>
    </animateMotion>
  </g>
</svg>
