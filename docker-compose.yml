services:
  postgres:
    image: postgres:16-alpine
    container_name: cadastro-ia-sakura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastro_ia_sakura
    ports:
      - "5432:5432"
    volumes:
      - cadastro_ia_sakura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cadastro_ia_sakura_pgdata:
